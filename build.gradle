plugins {
    id 'java'
    id 'antlr'
}

group = 'org.example'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

dependencies {
    def lombokVer = '1.18.46'
    compileOnly group: 'org.projectlombok', name: 'lombok', version: lombokVer
    annotationProcessor group: 'org.projectlombok', name: 'lombok', version: lombokVer

    antlr("org.antlr:antlr4:4.13.2")

    testImplementation platform('org.junit:junit-bom:6.0.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testImplementation("org.mockito:mockito-core:5.24.0")
}

//target directory for the new specialized parser
generateGrammarSource {
    outputDirectory = file("src/main/java/org/example/antlr")
}


test {
    useJUnitPlatform()
}